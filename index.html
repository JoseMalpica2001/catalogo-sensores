<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo mundial de sensores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EE; --surface:#FAFBF9; --ink:#0E1C26; --muted:#506068; --rule:#C9D1CF;
  --accent:#0B6E6E; --accent-ink:#FFFFFF; --price:#8A5A00; --focus:#0B6E6E;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1518; --surface:#141F23; --ink:#E6EEEC; --muted:#93A5A8; --rule:#27373B;
    --accent:#4FC3BD; --accent-ink:#06211F; --price:#E5B349; --focus:#4FC3BD;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1518; --surface:#141F23; --ink:#E6EEEC; --muted:#93A5A8; --rule:#27373B;
  --accent:#4FC3BD; --accent-ink:#06211F; --price:#E5B349; --focus:#4FC3BD;
}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 170px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--rule);padding:12px 16px 10px}
.wrap{max-width:860px;margin:0 auto}
h1{font-size:1.25rem;font-weight:800;letter-spacing:-.01em;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h1 small{font-weight:500;font-size:.8rem;color:var(--muted)}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:1rem;padding:12px 44px 12px 14px;border:2px solid var(--ink);border-radius:10px;background:var(--surface);color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:1.3rem;cursor:pointer;display:none}
.search.has button{display:block}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:.85rem;font-weight:500;padding:6px 11px;border-radius:999px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted));display:inline-block}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tools{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:8px;font-size:.85rem;color:var(--muted)}
.tools select{font:inherit;font-size:.85rem;padding:5px 8px;border-radius:8px;border:1px solid var(--rule);background:var(--surface);color:var(--ink)}
.tools .sel{display:flex;gap:6px;flex-wrap:wrap}
main{padding:12px 16px 64px}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
details{background:var(--surface);border:1px solid var(--rule);border-left:5px solid var(--c);border-radius:8px}
summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline}
summary::-webkit-details-marker{display:none}
.name{font-weight:700;font-size:1rem}
.price{font-weight:700;color:var(--price);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.meta{grid-column:1 / -1;color:var(--muted);font-size:.88rem}
details[open] summary{border-bottom:1px dashed var(--rule)}
dl{margin:0;padding:10px 14px 14px;display:grid;gap:10px}
dt{font-weight:700;font-size:.8rem;color:var(--muted)}
dd{margin:2px 0 0;max-width:68ch}
mark{background:color-mix(in srgb,var(--accent) 28%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.empty{padding:32px 8px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}
.empty button{margin-top:12px;font:inherit;padding:8px 14px;border-radius:8px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer}
footer{max-width:860px;margin:24px auto 0;font-size:.82rem;color:var(--muted)}
@media (min-width:700px){
  .bar{padding:14px 24px 12px} main{padding:16px 24px 64px}
  dl{grid-template-columns:1fr 1fr}
  dl .wide{grid-column:1 / -1}
}
@media (prefers-reduced-motion:no-preference){ details{transition:border-color .15s} }
</style>
</head>
<body>
<div class="bar">
  <div class="wrap">
    <h1>Catálogo de sensores <small id="count"></small></h1>
    <div class="search" id="sbox">
      <input id="q" type="search" inputmode="search" autocomplete="off" spellcheck="false"
        placeholder="Busca: temperatura, Bosch, concreto, 0–100 USD…" aria-label="Buscar sensores">
      <button id="clear" type="button" aria-label="Borrar búsqueda">×</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filtrar por familia"></div>
    <div class="tools">
      <div class="sel">
        <label>Precio
          <select id="price">
            <option value="0">Todos</option>
            <option value="10">Desde menos de $10</option>
            <option value="100">Desde menos de $100</option>
            <option value="1000">Desde menos de $1 000</option>
            <option value="10000">Desde menos de $10 000</option>
            <option value="10001">Desde $10 000 o más</option>
          </select>
        </label>
        <label>Orden
          <select id="sort">
            <option value="rel">Relevancia</option>
            <option value="az">Nombre A–Z</option>
            <option value="asc">Precio: menor a mayor</option>
            <option value="desc">Precio: mayor a menor</option>
          </select>
        </label>
      </div>
    </div>
  </div>
</div>

<main>
  <div class="wrap">
    <ul class="list" id="list"></ul>
    <footer>Los precios son rangos aproximados en USD (unidad suelta, varían por país, marca, volumen e impuestos). Los fabricantes son ejemplos representativos, no una lista completa. Verifica siempre con el proveedor antes de comprar.</footer>
  </div>
</main>

function norm(s){ return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
function esc(s){ return s.replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function fmt(n){ return n>=1000 ? n.toLocaleString("es-PE").replace(/,/g," ") : (n<1 ? n.toString().replace(".",",") : String(n).replace(".",",")); }
function priceText(a,b){ return "$"+fmt(a)+" – $"+fmt(b); }

var items = D.map(function(r,i){
  return {i:i,name:r[0],fam:r[1],mide:r[2],rango:r[3],usos:r[4],fab:r[5],pmin:r[6],pmax:r[7],
    hay:norm([r[0],FAM[r[1]][0],r[2],r[3],r[4],r[5]].join(" | ")), nn:norm(r[0])};
});

var state = {q:"",fam:"",price:0,sort:"rel"};
var $q=document.getElementById("q"), $list=document.getElementById("list"), $count=document.getElementById("count"),
    $chips=document.getElementById("chips"), $sbox=document.getElementById("sbox");

function buildChips(){
  var html='<button class="chip" type="button" data-f="" aria-pressed="true">Todos</button>';
  Object.keys(FAM).forEach(function(k){
    html+='<button class="chip" type="button" data-f="'+k+'" aria-pressed="false" style="--c:'+FAM[k][1]+'"><i></i>'+esc(FAM[k][0])+'</button>';
  });
  $chips.innerHTML=html;
}
function hl(text,terms){
  var out=esc(text);
  if(!terms.length) return out;
  var n=norm(text), marks=[];
  terms.forEach(function(t){
    var p=0; while((p=n.indexOf(t,p))>-1){ marks.push([p,p+t.length]); p+=t.length; }
  });
  if(!marks.length || n.length!==text.length) return out;
  marks.sort(function(a,b){return a[0]-b[0];});
  var merged=[marks[0]];
  for(var k=1;k<marks.length;k++){ var L=merged[merged.length-1]; if(marks[k][0]<=L[1]) L[1]=Math.max(L[1],marks[k][1]); else merged.push(marks[k]); }
  var res="",pos=0;
  merged.forEach(function(m){ res+=esc(text.slice(pos,m[0]))+"<mark>"+esc(text.slice(m[0],m[1]))+"</mark>"; pos=m[1]; });
  return res+esc(text.slice(pos));
}
function render(){
  var terms=norm(state.q).split(/\s+/).filter(Boolean);
  var res=items.filter(function(it){
    if(state.fam && it.fam!==state.fam) return false;
    if(state.price){
      if(state.price===10001){ if(it.pmin<10000) return false; }
      else if(it.pmin>=state.price) return false;
    }
    for(var t=0;t<terms.length;t++){ if(it.hay.indexOf(terms[t])<0) return false; }
    return true;
  });
  res.forEach(function(it){
    var s=0; terms.forEach(function(t){ if(it.nn.indexOf(t)>-1) s+=3; if(it.nn.indexOf(t)===0) s+=2; if(it.hay.indexOf(t)>-1) s+=1; });
    it.score=s;
  });
  if(state.sort==="rel") res.sort(function(a,b){return b.score-a.score || a.i-b.i;});
  if(state.sort==="az") res.sort(function(a,b){return a.nn.localeCompare(b.nn,"es");});
  if(state.sort==="asc") res.sort(function(a,b){return a.pmin-b.pmin;});
  if(state.sort==="desc") res.sort(function(a,b){return b.pmax-a.pmax;});
  $count.textContent=res.length+" de "+items.length+" sensores";
  if(!res.length){
    $list.innerHTML='<li class="empty"><b>No hay sensores con esa búsqueda</b>Prueba con menos palabras, otra familia o quita el filtro de precio.<br><button type="button" id="reset">Limpiar todo</button></li>';
    return;
  }
  $list.innerHTML=res.map(function(it){
    var f=FAM[it.fam], open=(terms.length && res.length<=3)?" open":"";
    return '<li><details style="--c:'+f[1]+'"'+open+'><summary><span class="name">'+hl(it.name,terms)+'</span><span class="price">'+priceText(it.pmin,it.pmax)+'</span><span class="meta">'+esc(f[0])+' · '+hl(it.rango,terms)+'</span></summary>'+
      '<dl><div class="wide"><dt>Qué registra</dt><dd>'+hl(it.mide,terms)+'</dd></div>'+
      '<div><dt>Rango y precisión típicos</dt><dd>'+hl(it.rango,terms)+'</dd></div>'+
      '<div><dt>Precio aproximado (USD)</dt><dd>'+priceText(it.pmin,it.pmax)+'</dd></div>'+
      '<div class="wide"><dt>Usos</dt><dd>'+hl(it.usos,terms)+'</dd></div>'+
      '<div class="wide"><dt>Fabricantes (ejemplos)</dt><dd>'+hl(it.fab,terms)+'</dd></div></dl></details></li>';
  }).join("");
}
function sync(){ $sbox.classList.toggle("has",!!$q.value); }
function resetAll(){
  state={q:"",fam:"",price:0,sort:"rel"}; $q.value=""; document.getElementById("price").value="0"; document.getElementById("sort").value="rel";
  Array.prototype.forEach.call($chips.children,function(c){c.setAttribute("aria-pressed",c.dataset.f===""?"true":"false");});
  sync(); render();
}
$q.addEventListener("input",function(){ state.q=$q.value; sync(); render(); });
document.getElementById("clear").addEventListener("click",function(){ $q.value=""; state.q=""; sync(); render(); $q.focus(); });
$chips.addEventListener("click",function(e){
  var b=e.target.closest(".chip"); if(!b) return;
  state.fam=b.dataset.f;
  Array.prototype.forEach.call($chips.children,function(c){c.setAttribute("aria-pressed",c===b?"true":"false");});
  render();
});
document.getElementById("price").addEventListener("change",function(e){ state.price=parseInt(e.target.value,10); render(); });
document.getElementById("sort").addEventListener("change",function(e){ state.sort=e.target.value; render(); });
$list.addEventListener("click",function(e){ if(e.target.id==="reset") resetAll(); });
document.addEventListener("keydown",function(e){
  if(e.key==="/" && document.activeElement!==$q){ e.preventDefault(); $q.focus(); $q.select(); }
  if(e.key==="Escape" && document.activeElement===$q){ $q.blur(); }
});
buildChips(); render();
</script>
